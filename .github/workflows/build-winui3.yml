name: WinUI 3 build

on:
  push:
    branches:
      - master
      - rewrite/csharp-winui3
  pull_request:
    paths:
      - "src/OpenAITunnelManager.**/**"
      - "tests/**"
      - "package/**"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "Directory.Packages.props"
      - "global.json"
      - "OpenAITunnelManager.slnx"
      - "README.md"
      - "RELEASE_NOTES.md"
      - ".github/workflows/build-winui3.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: winui3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enforce pure WinUI source tree
        shell: pwsh
        run: |
          $pythonFiles = Get-ChildItem -Recurse -File | Where-Object {
            $_.Extension -eq '.py' -or
            $_.Name -eq 'pyproject.toml' -or
            $_.Name -like 'requirements*.txt'
          }
          if ($pythonFiles) {
            $pythonFiles | ForEach-Object { Write-Host "Forbidden Python artifact: $($_.FullName)" }
            throw 'The WinUI source tree must not contain Python source/configuration files.'
          }

          $patterns = @(
            'System\.Windows\.Forms',
            'System\.Windows\.Controls',
            'System\.Windows\.Media',
            '<UseWindowsForms>\s*true\s*</UseWindowsForms>',
            '<UseWPF>\s*true\s*</UseWPF>',
            'PresentationFramework',
            'PresentationCore',
            'WindowsFormsIntegration',
            'Microsoft\.Xaml\.Behaviors\.Wpf',
            'Wpf\.Ui'
          )
          $files = Get-ChildItem src,tests -Recurse -File | Where-Object {
            $_.Extension -in @('.cs', '.csproj', '.xaml', '.props', '.targets')
          }
          $violations = @()
          foreach ($file in $files) {
            $text = Get-Content $file.FullName -Raw
            foreach ($pattern in $patterns) {
              if ($text -match $pattern) {
                $violations += "$($file.FullName): $pattern"
              }
            }
          }
          if ($violations.Count -gt 0) {
            $violations | ForEach-Object { Write-Host "Forbidden desktop-stack reference: $_" }
            throw 'Only WinUI 3 / Windows App SDK UI code is allowed.'
          }

          $removedFiles = @(
            'src/OpenAITunnelManager.App/ViewModels/ConnectionsViewModel.Logs.cs',
            'src/OpenAITunnelManager.App/ViewModels/ConnectionsViewModel.RuntimeMonitor.cs',
            'src/OpenAITunnelManager.App/MainWindow.LayoutAudit.cs',
            'src/OpenAITunnelManager.App/MainWindow.AdvancedSettings.cs'
          )
          foreach ($removedFile in $removedFiles) {
            if (Test-Path $removedFile) {
              throw "Removed feature file must not be restored: $removedFile"
            }
          }

          $removedPatterns = @(
            '\bRawLog\b',
            '\bVisibleLog\b',
            '\bRefreshLogAsync\b',
            '\bRefreshLogIncrementalAsync\b',
            '\bRestoreSelectedLogCache\b',
            '\bShowLogs_Click\b',
            '\bShowDiagnostics_Click\b',
            'Profile Import',
            'Profile Export',
            '复制可见日志',
            '导出日志'
          )
          $removedViolations = @()
          foreach ($file in $files) {
            $text = Get-Content $file.FullName -Raw
            foreach ($pattern in $removedPatterns) {
              if ($text -match $pattern) {
                $removedViolations += "$($file.FullName): $pattern"
              }
            }
          }
          if ($removedViolations.Count -gt 0) {
            $removedViolations | ForEach-Object { Write-Host "Removed feature residue: $_" }
            throw 'Removed features must be deleted from source, not hidden or kept as legacy backends.'
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401

      - name: Restore tests
        run: dotnet restore tests/OpenAITunnelManager.Tests/OpenAITunnelManager.Tests.csproj

      - name: Run behavior tests
        run: dotnet test tests/OpenAITunnelManager.Tests/OpenAITunnelManager.Tests.csproj -c Release --no-restore

  build:
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            rid: win-x64
            artifact: OpenAITunnelManager-win-x64
          - platform: ARM64
            rid: win-arm64
            artifact: OpenAITunnelManager-win-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401

      - name: Restore
        run: dotnet restore src/OpenAITunnelManager.App/OpenAITunnelManager.App.csproj -r ${{ matrix.rid }}

      - name: Publish ${{ matrix.rid }}
        run: >-
          dotnet publish src/OpenAITunnelManager.App/OpenAITunnelManager.App.csproj
          -c Release
          -p:Platform=${{ matrix.platform }}
          -r ${{ matrix.rid }}
          --self-contained true
          --no-restore
          -o artifacts/${{ matrix.rid }}

      - name: Verify published runtime files
        shell: pwsh
        run: |
          $output = "artifacts/${{ matrix.rid }}"
          $required = @(
            "OpenAITunnelManager.exe",
            "OpenAITunnelManager.pri",
            "Microsoft.UI.Xaml.dll",
            "Assets\AppIcon.png",
            "Assets\AppIcon.ico"
          )

          foreach ($file in $required) {
            $path = Join-Path $output $file
            if (-not (Test-Path $path)) {
              Write-Host "Published files:"
              Get-ChildItem $output -File -Recurse | ForEach-Object { $_.FullName.Substring((Resolve-Path $output).Path.Length + 1) } | Sort-Object
              throw "Required published file not found: $path"
            }
          }

          $forbiddenDesktopDlls = @(
            "System.Windows.Forms.dll",
            "PresentationFramework.dll",
            "PresentationCore.dll",
            "WindowsFormsIntegration.dll"
          )
          $desktopHits = Get-ChildItem $output -File -Recurse | Where-Object { $forbiddenDesktopDlls -contains $_.Name }
          if ($desktopHits) {
            $desktopHits | ForEach-Object { Write-Host "Forbidden published desktop-stack DLL: $($_.FullName)" }
            throw 'Published artifact contains WinForms/WPF runtime files; pure WinUI 3 requirement violated.'
          }

          $pythonHits = Get-ChildItem $output -File -Recurse | Where-Object {
            $_.Extension -eq '.py' -or
            $_.Name -eq 'pyproject.toml' -or
            $_.Name -like 'requirements*.txt'
          }
          if ($pythonHits) {
            $pythonHits | ForEach-Object { Write-Host "Forbidden published Python artifact: $($_.FullName)" }
            throw 'Published artifact contains Python files.'
          }

      - name: Smoke test x64 startup
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $exe = (Resolve-Path "artifacts/win-x64/OpenAITunnelManager.exe").Path
          $workingDirectory = Split-Path $exe
          $startedAt = Get-Date
          $log = Join-Path $workingDirectory "logs\app.log"

          if (Test-Path $log) {
            Remove-Item $log -Force
          }

          $process = Start-Process -FilePath $exe -WorkingDirectory $workingDirectory -PassThru
          Start-Sleep -Seconds 5

          if ($process.HasExited) {
            if (Test-Path $log) {
              Write-Host "----- app.log -----"
              Get-Content $log
              Write-Host "-------------------"
            }
            Write-Host "----- Windows Application events -----"
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $startedAt.AddSeconds(-2) } -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -match 'OpenAITunnelManager|Microsoft\.UI\.Xaml|WindowsAppRuntime' } |
              Select-Object TimeCreated, Id, ProviderName, LevelDisplayName, Message |
              Format-List
            Write-Host "--------------------------------------"
            throw "Published x64 application exited during startup with code $($process.ExitCode)"
          }

          if (Test-Path $log) {
            $logContent = Get-Content $log -Raw
            Write-Host "----- app.log -----"
            Write-Host $logContent
            Write-Host "-------------------"
            if ($logContent -match '\[FATAL\]') {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw "Published x64 application logged a FATAL startup error"
            }
          }

          Stop-Process -Id $process.Id -Force

      - name: Smoke test single-instance activation
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $exe = (Resolve-Path "artifacts/win-x64/OpenAITunnelManager.exe").Path
          $workingDirectory = Split-Path $exe
          $primary = Start-Process -FilePath $exe -WorkingDirectory $workingDirectory -PassThru
          Start-Sleep -Seconds 3
          if ($primary.HasExited) { throw "Primary instance exited unexpectedly" }

          $secondary = Start-Process -FilePath $exe -WorkingDirectory $workingDirectory -PassThru
          if (-not $secondary.WaitForExit(10000)) {
            Stop-Process -Id $secondary.Id -Force -ErrorAction SilentlyContinue
            Stop-Process -Id $primary.Id -Force -ErrorAction SilentlyContinue
            throw "Secondary instance did not redirect and exit within 10 seconds"
          }
          if ($primary.HasExited) { throw "Primary instance exited after secondary activation" }
          Stop-Process -Id $primary.Id -Force

      - name: Upload ${{ matrix.rid }} artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.rid }}/
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && startsWith(github.event.head_commit.message, 'Release v')
    needs:
      - test
      - build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401

      - name: Download x64 artifact
        uses: actions/download-artifact@v7
        with:
          name: OpenAITunnelManager-win-x64
          path: artifacts/win-x64

      - name: Download ARM64 artifact
        uses: actions/download-artifact@v7
        with:
          name: OpenAITunnelManager-win-arm64
          path: artifacts/win-arm64

      - name: Validate release version
        id: version
        shell: pwsh
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          $xml = [xml](Get-Content Directory.Build.props -Raw)
          $version = [string]$xml.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'Version is missing from Directory.Build.props.'
          }
          $expected = "Release v$version"
          if (-not $env:COMMIT_MESSAGE.StartsWith($expected)) {
            throw "Release commit message must start with '$expected'."
          }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release version: $version"

      - name: Clean runtime-generated files
        shell: pwsh
        run: |
          foreach ($rid in @('win-x64', 'win-arm64')) {
            foreach ($directory in @('config', 'logs', 'state')) {
              $path = Join-Path "artifacts/$rid" $directory
              if (Test-Path $path) {
                Remove-Item $path -Recurse -Force
              }
            }
          }

      - name: Pack GitHub Package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          dotnet pack package/OpenAITunnelManager.Package.csproj -c Release -o artifacts/package /p:PackageVersion=$version
          if ($LASTEXITCODE -ne 0) { throw 'NuGet package creation failed.' }

          $package = Get-ChildItem artifacts/package/OpenAITunnelManager.Windows.*.nupkg | Where-Object { $_.Name -notlike '*.symbols.nupkg' } | Select-Object -First 1
          if (-not $package) { throw 'NuGet package was not produced.' }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName })
            foreach ($required in @(
              'tools/win-x64/OpenAITunnelManager.exe',
              'tools/win-arm64/OpenAITunnelManager.exe',
              'README.md'
            )) {
              if ($entries -notcontains $required) {
                throw "Required package entry not found: $required"
              }
            }
          }
          finally {
            $archive.Dispose()
          }

      - name: Publish GitHub Package
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $package = Get-ChildItem artifacts/package/OpenAITunnelManager.Windows.*.nupkg | Where-Object { $_.Name -notlike '*.symbols.nupkg' } | Select-Object -First 1
          if (-not $package) { throw 'NuGet package not found.' }
          dotnet nuget push $package.FullName --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key $env:GITHUB_TOKEN --skip-duplicate
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Packages publish failed.' }

      - name: Create release archives
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/win-x64/* -DestinationPath artifacts/OpenAITunnelManager-win-x64.zip -Force
          Compress-Archive -Path artifacts/win-arm64/* -DestinationPath artifacts/OpenAITunnelManager-win-arm64.zip -Force

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists."
          }
          gh release create $tag `
            "artifacts/OpenAITunnelManager-win-x64.zip#OpenAITunnelManager-win-x64.zip" `
            "artifacts/OpenAITunnelManager-win-arm64.zip#OpenAITunnelManager-win-arm64.zip" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "OpenAI MCP Tunnel Manager $tag" `
            --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publish failed.' }
