name: WinUI 3 build

on:
  push:
    branches:
      - rewrite/csharp-winui3
  pull_request:
    paths:
      - "src/OpenAITunnelManager.**/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - "OpenAITunnelManager.slnx"
      - ".github/workflows/build-winui3.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401

      - name: Restore
        run: dotnet restore OpenAITunnelManager.slnx

      - name: Build WinUI 3 x64
        run: dotnet build src/OpenAITunnelManager.App/OpenAITunnelManager.App.csproj -c Release -p:Platform=x64 -r win-x64 --no-restore
