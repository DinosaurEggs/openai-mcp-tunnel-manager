name: WinUI 3 build

on:
  push:
    branches:
      - rewrite/csharp-winui3
  pull_request:
    paths:
      - "src/OpenAITunnelManager.**/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - "OpenAITunnelManager.slnx"
      - ".github/workflows/build-winui3.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: winui3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            rid: win-x64
            artifact: OpenAITunnelManager-win-x64
          - platform: ARM64
            rid: win-arm64
            artifact: OpenAITunnelManager-win-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401

      - name: Restore
        run: dotnet restore src/OpenAITunnelManager.App/OpenAITunnelManager.App.csproj -r ${{ matrix.rid }}

      - name: Publish ${{ matrix.rid }}
        run: >-
          dotnet publish src/OpenAITunnelManager.App/OpenAITunnelManager.App.csproj
          -c Release
          -p:Platform=${{ matrix.platform }}
          -r ${{ matrix.rid }}
          --self-contained true
          --no-restore
          -o artifacts/${{ matrix.rid }}

      - name: Verify published executable
        shell: pwsh
        run: |
          $exe = "artifacts/${{ matrix.rid }}/OpenAITunnelManager.exe"
          if (-not (Test-Path $exe)) {
            throw "Published executable not found: $exe"
          }

      - name: Smoke test x64 startup
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $exe = (Resolve-Path "artifacts/win-x64/OpenAITunnelManager.exe").Path
          $workingDirectory = Split-Path $exe
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "OpenAITunnelManagerSmoke"
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null

          $process = Start-Process -FilePath $exe -WorkingDirectory $workingDirectory -PassThru
          Start-Sleep -Seconds 5

          if ($process.HasExited) {
            $log = Join-Path $env:LOCALAPPDATA "OpenAITunnelManager\logs\app.log"
            if (Test-Path $log) {
              Write-Host "----- app.log -----"
              Get-Content $log
              Write-Host "-------------------"
            }
            throw "Published x64 application exited during startup with code $($process.ExitCode)"
          }

          Stop-Process -Id $process.Id -Force

      - name: Upload ${{ matrix.rid }} artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.rid }}/
          if-no-files-found: error
          retention-days: 14
