name: build-windows
on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write
  packages: write

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt
      - name: Verify
        shell: pwsh
        run: python verify.py
      - name: Package
        shell: pwsh
        run: |
          python -m pip install "pyinstaller>=6.11,<7"
          python tools/build_icon.py
          pyinstaller --noconfirm --clean --windowed --onefile --collect-submodules pystray --icon build/app_icon.ico --version-file tools/version_info.txt --add-data "src/openai_tunnel_manager/assets/app_icon.jpg;openai_tunnel_manager/assets" --name OpenAITunnelManager --paths src launcher.py
      - uses: actions/upload-artifact@v7
        with:
          path: dist/OpenAITunnelManager.exe
          archive: false
      - name: Read project version
        id: version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Project version: $version"
      - name: Validate release commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && startsWith(github.event.head_commit.message, 'Release v')
        shell: pwsh
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          $version = "${{ steps.version.outputs.value }}"
          if (-not $env:COMMIT_MESSAGE.StartsWith("Release v$version")) {
              throw "Release commit message does not match project version $version"
          }
      - name: Pack GitHub Package
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && startsWith(github.event.head_commit.message, 'Release v')
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          dotnet pack package/OpenAITunnelManager.Package.csproj --configuration Release --output dist/package /p:Version=$version
          if ($LASTEXITCODE -ne 0) { throw "NuGet package creation failed." }
      - name: Publish GitHub Package
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && startsWith(github.event.head_commit.message, 'Release v')
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $package = Get-ChildItem dist/package/*.nupkg | Where-Object { $_.Name -notlike '*.symbols.nupkg' } | Select-Object -First 1
          if (-not $package) { throw "GitHub Package .nupkg not found." }
          dotnet nuget push $package.FullName --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key $env:GITHUB_TOKEN --skip-duplicate
          if ($LASTEXITCODE -ne 0) { throw "GitHub Packages publish failed." }
      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && startsWith(github.event.head_commit.message, 'Release v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
              Write-Host "Release $tag already exists; preserving the published release."
              exit 0
          }
          gh release create $tag "dist/OpenAITunnelManager.exe#OpenAITunnelManager.exe" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "OpenAI MCP Tunnel Manager $tag" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publish failed." }
