name: build-windows
on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt
      - name: Verify
        shell: pwsh
        run: python verify.py
      - name: Package
        shell: pwsh
        run: |
          python -m pip install "pyinstaller>=6.11,<7"
          python tools/build_icon.py
          pyinstaller --noconfirm --clean --windowed --onefile --collect-submodules pystray --icon build/app_icon.ico --add-data "src/openai_tunnel_manager/assets/app_icon.jpg;openai_tunnel_manager/assets" --name OpenAITunnelManager --paths src launcher.py
      - uses: actions/upload-artifact@v7
        with:
          path: dist/OpenAITunnelManager.exe
          archive: false
