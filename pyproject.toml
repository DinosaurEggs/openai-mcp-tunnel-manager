[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openai-mcp-tunnel-manager"
version = "0.3.0"
description = "Windows desktop manager for OpenAI tunnel-client MCP runtimes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
build = ["pyinstaller>=6.11,<7"]

[project.scripts]
openai-tunnel-manager = "openai_tunnel_manager.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
